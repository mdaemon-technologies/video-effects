# Stages a new npm version when a GitHub Release is published. npm trusted publishing (OIDC)
# authenticates the job, so no npm token is stored. A maintainer then approves the staged
# version with 2FA on npmjs.com (or `npm stage approve`) before it is public.

name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Keep in step with the smoke matrix in node.js.yml.
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    # The publish job fails unless the committed dist/ matches its fresh build, so this
    # tests the same files that get published.
    - run: npm run test:smoke

  publish:
    needs: smoke
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # lets npm exchange a GitHub OIDC token for a short-lived publish token

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        registry-url: https://registry.npmjs.org
        cache: 'npm'
    - run: npm install -g npm@latest   # trusted publishing and staged publishing need a recent npm
    - run: npm ci
    - run: npm run build
    - name: Check the committed dist/ matches the build
      run: |
        git status --porcelain -- dist
        test -z "$(git status --porcelain -- dist)" || { echo "::error::dist/ is stale. Run npm run build and commit the result."; exit 1; }
    - run: npm test
    - run: npm run test:types
    - name: Check the release tag matches package.json
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: test "v$(node -p "require('./package.json').version")" = "$TAG"
    - run: npm stage publish
